name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run core numerical and reproduction-entry validation suite
        run: python -m pytest tests/test_core.py tests/test_reproduction_entry.py -v -p no:cacheprovider

  kwant-validation:
    name: Kwant cross-validation (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create the Kwant environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: kwant-validate
          environment-file: environment-kwant.yml
          auto-activate-base: false

      - name: Install the local package
        shell: bash -el {0}
        run: python -m pip install -e . --no-deps

      - name: Run the complete Kwant/NEGF validation suite
        shell: bash -el {0}
        run: python -m pytest tests/test_kwant_validation.py -v -p no:cacheprovider
